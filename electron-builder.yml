appId: com.sun.spotifycardgenerator
productName: Spotify Card Generator
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
# koffi ships a native .node binary which cannot be loaded from inside an asar archive
asarUnpack:
  - "**/node_modules/koffi/**"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
